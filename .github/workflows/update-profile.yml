name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile.py

      - name: Commit changes
        run: |
          if git diff --quiet -- profile.svg; then
            echo "No profile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          git commit -m "chore: update profile data"
          git push
