name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile.py

      - name: Commit generated profile
        run: |
          if git diff --quiet -- profile.svg README.md; then
            echo "Profile is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.svg README.md
          git commit -m "chore: refresh profile"
          git push
