name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - scripts/generate_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete old generated files
        run: |
          git rm -f --ignore-unmatch profile.svg README.md
          rm -f profile.svg README.md

      - name: Generate fresh SVG and README
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_DATA_TOKEN: ${{ secrets.PROFILE_DATA_TOKEN }}
        run: |
          python3 scripts/generate_profile.py
          test -s profile.svg
          test -s README.md

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile.svg README.md
          if git diff --cached --quiet; then
            echo "Generated files are unchanged."
            exit 0
          fi
          git commit -m "chore: regenerate profile [skip ci]"
          git push
